# ClipForge auf einem eigenen Server (VPS) oder lokal mit Docker.
#   1. Datei deploy/clipforge.env aus deploy/clipforge.env.example anlegen
#   2. docker compose up -d --build
services:
  clipforge:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - deploy/clipforge.env
    volumes:
      - clipforge-data:/data
    restart: unless-stopped
    # FFmpeg-Renders brauchen Arbeitsspeicher; 2 GB sind ein sinnvolles Minimum.
    mem_limit: 3g
    cpus: 2
    # Protokolle begrenzen (sonst wächst die Platte unbemerkt voll)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  clipforge-data:
